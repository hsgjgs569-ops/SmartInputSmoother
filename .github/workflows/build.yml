name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: ${{ matrix.config.target }}-v2
          max-size: 500M

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Android NDK r26b
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - name: Hack - Fix missing mapping header
        run: |
          echo "Hack: Creating missing mapping directory..."
          mkdir -p build/bindings/bindings/Geode/mapping || true
          mkdir -p "${{ github.workspace }}/build/bindings/bindings/Geode/mapping" || true
          for h in CCPoint CCSize CCRect CCObject CCArray CCDictionary CCNode CCString; do
            cat > "build/bindings/bindings/Geode/mapping/${h}.hpp" <<EOF
          #pragma once
          #include <cocos2d.h>
          using cocos2d::${h};
          EOF
            cat > "${{ github.workspace }}/build/bindings/bindings/Geode/mapping/${h}.hpp" <<EOF
          #pragma once
          #include <cocos2d.h>
          using cocos2d::${h};
          EOF
          done
          # extras sometimes referenced
          echo '#pragma once
          #include <cocos2d.h>
          using cocos2d::CCPoint;
          static const cocos2d::CCPoint CCPointZero = cocos2d::CCPointZero;' > build/bindings/bindings/Geode/mapping/CCPoint.hpp || true

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          sdk: 'v2.0.0-beta.27'

  package:
    name: Package .geode
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartInputSmoother-geode
          path: ${{ steps.build.outputs.build-output }}
